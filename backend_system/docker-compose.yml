version: "3.9"

services:
  cassandra:
    image: cassandra:5.0
    container_name: shop-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: payments-cluster  # must match saved data in cassandra_data volume
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "bash", "-lc", "nodetool status | grep -q 'UN' || nodetool status | grep -q 'UJ' || exit 1"]
      interval: 20s
      timeout: 20s
      retries: 12
      start_period: 40s

volumes:
  cassandra_data:
