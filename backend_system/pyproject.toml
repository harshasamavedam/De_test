[project]
name = "shop-commerce-platform"
version = "0.1.0"
description = "Shop commerce platform with a query-first Cassandra model, synthetic data simulator and query API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.16",
    "cassandra-driver>=3.29.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.1.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.31.0",
    "typing-extensions>=4.8.0",
    "asyncio>=3.4.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "boto3>=1.43.108",
    "duckdb>=1.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
